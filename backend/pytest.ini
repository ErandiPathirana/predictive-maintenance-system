[pytest]
# Run from the backend/ folder:  python -m pytest
pythonpath = . ../tests/backend
testpaths = ../tests/backend
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
markers =
    real_artifacts: needs the TRAINED model bundle (ml/artifacts or PM_TEST_BUNDLE_DIR); skipped as BLOCKED when it is absent
    mock_ml: the model is replaced by a stub; tests backend behaviour independent of inference
    synthetic_bundle: real loader and inference code on a bundle with made-up weights (proves software, not model quality)
